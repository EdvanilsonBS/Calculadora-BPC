<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — Calculadora BPC</title>
<link rel="stylesheet" href="styles.css" />
<link rel="apple-touch-icon" sizes="180x180" href="Icone/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="Icone/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="Icone/favicon-16x16.png">
<link rel="manifest" href="Icone/site.webmanifest">
</head>
<body data-splash-wait>

<div id="splash" class="splash" role="status" aria-label="Carregando">
  <img src="img/logo.png" alt="Calculadora BPC" />
</div>


<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Res. CNJ nº 630/2025</p>
    <h1>Calculadora BPC</h1>

    <div class="auth-box">
      <!-- Caixa de erro: começa vazia e escondida. O JavaScript preenche e mostra. -->
      <p class="form-message error" id="msg-error"></p>

      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="voce@exemplo.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
      </form>

      <p class="auth-links">
        <a href="forgot-password.html">Esqueci minha senha</a>
      </p>
    </div>

    <p class="auth-footnote">
      Acesso apenas por convite. Fale com o administrador para receber uma conta.
    </p>
  </div>
</div>

<!-- Ordem importante: configuração -> funções de login -->
<script src="splash.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  // Se a pessoa já está logada, pula direto para a calculadora.
  (async function () {
    const session = await getSession();
    if (session) window.location.href = "app.html";
    else hideSplash(); // sem login: mostra o formulário
  })();

  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("msg-error");
  const submitBtn = document.getElementById("submit-btn");

  // Quando clicar em "Entrar":
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); // impede a página de recarregar
    errorMsg.classList.remove("show");
    submitBtn.disabled = true; // evita clique duplo
    submitBtn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await signIn(email, password);

    if (error) {
      // Mostra o erro e libera o botão de novo.
      errorMsg.textContent = traduzErroAuth(error);
      errorMsg.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
    } else {
      window.location.href = "app.html";
    }
  });
</script>
</body>
</html>

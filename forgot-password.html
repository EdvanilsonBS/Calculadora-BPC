<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recuperar senha — Calculadora BPC</title>
<link rel="stylesheet" href="styles.css" />
<link rel="apple-touch-icon" sizes="180x180" href="Icone/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="Icone/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="Icone/favicon-16x16.png">
<link rel="manifest" href="Icone/site.webmanifest">
</head>
<body>

<div id="splash" class="splash" role="status" aria-label="Carregando">
  <img src="img/logo.png" alt="Calculadora BPC" />
</div>


<!-- Recuperação em 2 passos na mesma página:
     Passo 1: pede o e-mail e envia um código de 6 dígitos.
     Passo 2: a pessoa digita o código e escolhe a nova senha. -->
<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Res. CNJ nº 630/2025</p>
    <h1>Recuperar senha</h1>

    <div class="auth-box">
      <p class="form-message error" id="msg-error"></p>
      <p class="form-message success" id="msg-info"></p>

      <!-- PASSO 1 -->
      <form id="form-email">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="voce@exemplo.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn-primary" id="btn-email">Enviar código por e-mail</button>
      </form>

      <!-- PASSO 2 (escondido até o código ser enviado) -->
      <form id="form-codigo" hidden>
        <div class="field">
          <label for="codigo">Código recebido por e-mail</label>
          <input type="text" id="codigo" placeholder="6 dígitos" required inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        </div>
        <div class="field">
          <label for="password">Nova senha</label>
          <input type="password" id="password" placeholder="mínimo 8 caracteres" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Confirmar nova senha</label>
          <input type="password" id="password2" placeholder="repita a senha" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary" id="btn-codigo">Salvar nova senha</button>
      </form>
    </div>

    <p class="auth-footnote">
      Lembrou a senha? <a href="login.html" style="color:#C7CEE2;">Voltar para entrar</a>
    </p>
  </div>
</div>

<script src="splash.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  const formEmail = document.getElementById("form-email");
  const formCodigo = document.getElementById("form-codigo");
  const errorMsg = document.getElementById("msg-error");
  const infoMsg = document.getElementById("msg-info");

  let emailInformado = ""; // guardado do passo 1 para usar no passo 2

  function mostrarErro(texto) {
    infoMsg.classList.remove("show");
    errorMsg.textContent = texto;
    errorMsg.classList.add("show");
  }

  function mostrarInfo(texto) {
    errorMsg.classList.remove("show");
    infoMsg.textContent = texto;
    infoMsg.classList.add("show");
  }

  // PASSO 1: pedir o código
  formEmail.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-email");
    errorMsg.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    emailInformado = document.getElementById("email").value.trim();
    const { error } = await sendPasswordReset(emailInformado);

    btn.disabled = false;
    btn.textContent = "Enviar código por e-mail";

    if (error) return mostrarErro(traduzErroAuth(error));

    // Mensagem neutra de propósito: não revela se o e-mail tem conta.
    formEmail.hidden = true;
    formCodigo.hidden = false;
    mostrarInfo("Se esse e-mail tiver uma conta, enviamos um código de 6 dígitos. Veja também a caixa de spam.");
  });

  // PASSO 2: confirmar código + nova senha
  formCodigo.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-codigo");
    errorMsg.classList.remove("show");

    const codigo = document.getElementById("codigo").value.trim();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;

    if (password !== password2) return mostrarErro("As senhas não coincidem.");

    btn.disabled = true;
    btn.textContent = "Salvando...";

    const { error } = await confirmPasswordReset(emailInformado, codigo, password);

    if (error) {
      btn.disabled = false;
      btn.textContent = "Salvar nova senha";
      return mostrarErro(traduzErroAuth(error));
    }

    formCodigo.hidden = true;
    mostrarInfo("Senha atualizada! Redirecionando para o login...");
    setTimeout(() => (window.location.href = "login.html"), 2000);
  });
</script>
</body>
</html>
